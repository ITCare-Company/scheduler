################
# DrupalCI includes:
# As long as you include this, any future includes added by the Drupal Association will be accessible to your pipelines automatically.
# View these include files at https://git.drupalcode.org/project/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Pipeline configuration variables
################
variables:
  OPT_IN_TEST_CURRENT: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 0
  _SHOW_ENVIRONMENT_VARIABLES: 1
  _PHPUNIT_CONCURRENT: 1
  _PHPUNIT_TESTGROUPS: ''
  _PHPUNIT_PARAMETERS:
    value: ''
    description: 'Additional parameters for use in PHPUNIT parallel job matrix.'

################
# Job overrides
################

# -------------------------------- BUILD ---------------------------------------

composer:
  after_script:
    # Show the last three commits. Current directory /builds/project/scheduler ($CI_PROJECT_DIR) is correct.
    - git show -3 --stat

composer (next major):
  variables:
    LENIENT_ALLOW_LIST: devel,devel_generate,rules,commerce,entity,address,state_machine,entity_reference_revisions,profile,inline_entity_form,token,workbench_moderation,workbench_moderation_actions

# -------------------------------- VALIDATE ------------------------------------

eslint:
  allow_failure: false

stylelint:
  allow_failure: false

phpcs:
  allow_failure: false

phpstan:
  after_script:
    - test -f phpstan.neon && echo "=== This is phpstan.neon ===" && cat phpstan.neon
    - php $CI_PROJECT_DIR/scripts/phpstan-baseline-summary.php phpstan-baseline-to-fix.neon

# Do not automatically run, but allow the job to be started manually.
phpstan (next minor):
  rules:
    - !reference [ .opt-in-next-minor-rule ]
    - !reference [ .skip-phpstan-rule ]
    - when: manual

phpstan (next major):
  rules:
    - !reference [ .opt-in-next-major-rule ]
    - !reference [ .skip-phpstan-rule ]
    - when: manual

cspell:
  after_script:
    - WORDS=$CI_PROJECT_DIR/_cspell_unrecognized_words.txt
    - test -f $WORD && echo "=== This is $WORDS ===" && cat $WORDS || true

# -------------------------------- TEST ----------------------------------------

.scheduler-matrix: &scheduler-matrix
  parallel:
    matrix:
      # Run test groups in parallel. This also speeds up identification of failing tests.
      # @todo put back "scheduler_drush" when https://www.drupal.org/i/3359998 is solved.
      - _MATRIX_VALUE:
        - scheduler
        - scheduler_api
        # - scheduler_drush
        - scheduler_js
        - scheduler_kernel
        - scheduler_rules_integration

phpunit:
  <<: *scheduler-matrix
  before_script:
    - echo "_PHPUNIT_CONCURRENT=$_PHPUNIT_CONCURRENT, _PHPUNIT_TESTGROUPS=$_PHPUNIT_TESTGROUPS"
    - echo "_MATRIX_VALUE=$_MATRIX_VALUE, _PHPUNIT_EXTRA=$_PHPUNIT_EXTRA"
    - echo "SYMFONY_DEPRECATIONS_HELPER=$SYMFONY_DEPRECATIONS_HELPER"
    - echo "CI_JOB_NAME=$CI_JOB_NAME, CI_JOB_NAME chopped=${CI_JOB_NAME%:*}"
    - |
      if [[ "$_PHPUNIT_CONCURRENT" == "0" ]]; then
        # Specify parameters that will be passed to PHPUNIT (needs --group)
        export _PHPUNIT_EXTRA="$_PHPUNIT_PARAMETERS --group $_MATRIX_VALUE"
      else
        # Specify parameters that will be passed to RUN-TESTS.SH (without --group)
        export _PHPUNIT_EXTRA="$_PHPUNIT_PARAMETERS $_MATRIX_VALUE"
        # Ensure the value is 1 if it is not 0.
        export _PHPUNIT_CONCURRENT=1
      fi
    - echo "End of before_script _PHPUNIT_EXTRA=$_PHPUNIT_EXTRA, _PHPUNIT_CONCURRENT=$_PHPUNIT_CONCURRENT"

phpunit (next minor):
  allow_failure: true
  rules:
    - !reference [ .opt-in-next-minor-rule ]
    - !reference [ .skip-phpunit-rule ]
    # Do not automatically run, but allow the job to be started manually.
    # To do this the .phpunit-tests-exist-rule has to be removed.
    - when: manual
  variables:
    # Use core ignoreFile to show deprecations. This will only work with $_PHPUNIT_CONCURRENT=1 so make sure that is also set.
    _PHPUNIT_CONCURRENT: 1
    SYMFONY_DEPRECATIONS_HELPER: "ignoreFile=$CI_PROJECT_DIR/$_WEB_ROOT/core/.deprecation-ignore.txt"

phpunit (next major):
  rules:
    - !reference [ .opt-in-next-major-rule ]
    - !reference [ .skip-phpunit-rule ]
    # Do not automatically run, but allow the job to be started manually.
    # To do this the .phpunit-tests-exist-rule has to be removed.
    - when: manual
  variables:
    # Use core ignoreFile to show deprecations. This will only work with $_PHPUNIT_CONCURRENT=1 so make sure that is also set.
    _PHPUNIT_CONCURRENT: 1
    SYMFONY_DEPRECATIONS_HELPER: "ignoreFile=$CI_PROJECT_DIR/$_WEB_ROOT/core/.deprecation-ignore.txt"
